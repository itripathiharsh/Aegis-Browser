name: Build & Release Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag override (e.g., v1.0.5). Leave blank to use the pushed tag or default.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build core-ui + Aegis Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version from tag or input
        id: version
        run: |
          RAW="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${RAW#v}"
          if [[ -z "$VERSION" || "$VERSION" == "${{ github.ref_name }}" && "$VERSION" != v* ]]; then
            VERSION="1.0.5"
          fi
          CODE=$(echo "$VERSION" | awk -F. '{printf "%d%03d%03d", $1, $2, $3}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "🏷️ Version=$VERSION  Code=$CODE"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: core-ui/package-lock.json

      - name: Install, test, and build core-ui
        working-directory: core-ui
        env:
          VITE_AEGIS_GITHUB_REPO: ${{ github.repository }}
          VITE_AEGIS_APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci
          npm test
          npm run build

      - name: Sync built UI & shared filter lists into android-shell assets
        run: node scripts/sync-assets.mjs

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Make gradlew executable (if present)
        working-directory: android-shell
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Run Android unit tests
        working-directory: android-shell
        run: |
          GRADLE_CMD="gradle"
          [ -x ./gradlew ] && GRADLE_CMD="./gradlew"
          $GRADLE_CMD testDebugUnitTest --no-daemon \
            -PaegisVersionName="${{ steps.version.outputs.version }}" \
            -PaegisVersionCode="${{ steps.version.outputs.code }}" \
            -PaegisGithubRepo="${{ github.repository }}"

      - name: Build Debug & Release APKs
        working-directory: android-shell
        run: |
          GRADLE_CMD="gradle"
          [ -x ./gradlew ] && GRADLE_CMD="./gradlew"
          $GRADLE_CMD assembleDebug assembleRelease --no-daemon \
            -PaegisVersionName="${{ steps.version.outputs.version }}" \
            -PaegisVersionCode="${{ steps.version.outputs.code }}" \
            -PaegisGithubRepo="${{ github.repository }}"

      - name: Rename release APK for distribution
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APK=$(find android-shell/app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" "android-shell/app/build/outputs/apk/release/AegisBrowser-v${VERSION}.apk"
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-browser-debug-apk
          path: android-shell/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-browser-release-apk
          path: android-shell/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Aegis Browser ${{ steps.version.outputs.tag }}"
          body: |
            ## Aegis Browser ${{ steps.version.outputs.tag }}

            **What's new:**
            - Updated ad-block filter lists (EasyList + EasyPrivacy + uBlock Origin)
            - Stability and playback improvements

            **Install:** Download `AegisBrowser-${{ steps.version.outputs.tag }}.apk` below and install on your Android device.
          draft: false
          prerelease: false
          files: |
            android-shell/app/build/outputs/apk/release/AegisBrowser-v${{ steps.version.outputs.version }}.apk
